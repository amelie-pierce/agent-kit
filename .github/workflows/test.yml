name: Test
on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: node scripts/linux-install-smoke.mjs
