name: Test
on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh
      - name: Single installer dry run (install.sh on macOS and Linux, install.ps1 on Windows)
        run: node scripts/installer-dry-run-smoke.mjs
      - name: Lifecycle command dry-run smoke
        run: node scripts/lifecycle-dry-run-smoke.mjs
      - if: matrix.os == 'ubuntu-latest'
        run: node scripts/linux-install-smoke.mjs
      - if: matrix.os == 'windows-latest'
        run: node scripts/windows-preflight-smoke.mjs
